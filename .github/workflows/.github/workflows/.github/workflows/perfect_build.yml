name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Unzip Project
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        echo "Extracting $ZIP_FILE..."
        unzip -o "$ZIP_FILE"

    - name: Build APK with Gradle System
      run: |
        # البحث عن المجلد الذي يحتوي على build.gradle.kts وبناء التطبيق منه مباشرة
        PROJECT_DIR=$(find . -name "build.gradle*" -exec dirname {} \; | head -n 1)
        cd "$PROJECT_DIR"
        gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LinguaVN-App
        path: "**/build/outputs/apk/debug/*.apk"
