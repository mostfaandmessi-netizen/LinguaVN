name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip and Build
      run: |
        # 1. فك ضغط أول ملف ZIP موجود
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        echo "Extracting: $ZIP_FILE"
        unzip -o "$ZIP_FILE"
        
        # 2. إعطاء صلاحيات التشغيل لأي ملف gradlew
        find . -name "gradlew" -exec chmod +x {} \;
        
        # 3. تحديد مجلد المشروع الرئيسي
        BUILD_DIR=$(find . -name "build.gradle*" -exec dirname {} \; | head -n 1)
        echo "Project root found at: $BUILD_DIR"
        cd "$BUILD_DIR"
        
        # 4. التجميع والتجميع المباشر
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LinguaVN-App
        path: "**/build/outputs/apk/debug/*.apk"
        
