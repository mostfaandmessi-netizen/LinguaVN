name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip and Build
      run: |
        # فك ضغط أي ملف ZIP موجود في المستودع بغض النظر عن اسمه
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        echo "Found zip file: $ZIP_FILE"
        unzip -o "$ZIP_FILE"
        
        # البحث عن ملفات البناء وإعطاء الصلاحيات
        find . -name "gradlew" -exec chmod +x {} \;
        
        # البحث عن مجلد app وتغيير المسار إليه للبدء بالبناء
        BUILD_DIR=$(find . -name "build.gradle*" -exec dirname {} \; | head -n 1)
        echo "Building inside: $BUILD_DIR"
        cd "$BUILD_DIR"
        
        # استخدام gradlew إن وجد، أو استخدام gradle المثبت في النظام مباشرة
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LinguaVN-App
        path: "**/build/outputs/apk/debug/*.apk"
        
